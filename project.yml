# Configuration XcodeGen : décrit le projet Xcode sous forme de texte.
# Sur Mac (ou sur le CI GitHub) : `brew install xcodegen && xcodegen generate`
# génère Matbakhi.xcodeproj à partir de ce fichier.
name: Matbakhi

options:
  bundleIdPrefix: com.matbakhi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0

targets:
  Matbakhi:
    type: application
    platform: iOS
    sources:
      - path: Matbakhi
    info:
      path: Matbakhi/Info.plist
      properties:
        CFBundleDisplayName: Matbakhi
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Identifiant d'application AdMob DE TEST fourni par Google (obligatoire pour le SDK)
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        # Retour dans l'app après la connexion Google (voir REVERSED_CLIENT_ID plus bas)
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(REVERSED_CLIENT_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matbakhi.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: $(inherited) -ObjC
        CODE_SIGN_STYLE: Automatic
        # Google Sign-In : remplacer par la valeur REVERSED_CLIENT_ID du fichier GoogleService-Info.plist
        REVERSED_CLIENT_ID: com.googleusercontent.apps.A-REMPLACER
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
        product: GoogleMobileAds
    scheme:
      testTargets:
        - MatbakhiTests

  MatbakhiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MatbakhiTests
    dependencies:
      - target: Matbakhi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
